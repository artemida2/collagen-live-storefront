# Настройки админки. Правится разработчиком, не через саму админку.
#
# Публикация здесь — это коммит в репозиторий: вы нажимаете «Сохранить»,
# GitHub Actions пересобирает сайт, и примерно через минуту правка на сайте.
# Каждая версия остаётся в истории, откатить можно любую.

backend:
  name: github
  repo: artemida2/collagen-live-storefront
  branch: master
  # Вход только по личному токену: он остаётся в вашем браузере и никуда,
  # кроме самого GitHub, не отправляется. Сторонних сервисов в цепочке нет.
  auth_methods: [token]
  commit_messages:
    update: 'Правка из админки: {{collection}} · {{slug}}'
    uploadMedia: 'Загрузка файла из админки: {{path}}'
    deleteMedia: 'Удаление файла из админки: {{path}}'

site_url: https://crimeacollagen.ru
app_title: Collagen Live · управление сайтом
logo_url: /favicon.svg

# Куда складывать картинки, загруженные через админку.
media_folder: public/media/pages
public_folder: /media/pages

collections:
  - name: products
    label: Товары и цены
    label_singular: Товар
    folder: src/content/products
    extension: json
    format: json
    # Добавление и удаление товаров закрыто намеренно: у каждого вкуса девять
    # кадров галереи и свой цвет карточки, они живут в коде. Новый вкус
    # заводится разработчиком, здесь правится всё остальное.
    create: false
    delete: false
    identifier_field: name
    summary: '{{name}} · {{price}} ₽'
    fields:
      - name: name
        label: Название
        widget: string
        hint: Так товар подписан в каталоге и в корзине.
      - name: price
        label: Цена
        widget: number
        value_type: int
        min: 1
        after_input: ₽
        hint: Целое число, без пробелов и без знака рубля.
      - name: was
        label: Старая цена
        widget: number
        value_type: int
        min: 1
        required: false
        after_input: ₽
        hint: Зачёркнутая цена рядом с текущей. Должна быть больше текущей. Оставьте пустым, если скидки нет.
      - name: flavour
        label: Вкус
        widget: string
        hint: Одно-два слова. Показывается на плашке вкуса.
      - name: meta
        label: Подпись под названием
        widget: string
        hint: Например «С натуральным соком» или «Пищевой коллаген в желе».
      - name: course
        label: Длительность курса
        widget: string
        hint: Например «курс 1,5 месяца».
      - name: weight
        label: Вес
        widget: string
        hint: Например «0,5 кг» или «3 × 500 г».
      - name: juice
        label: Сок в составе
        widget: string
        required: false
        hint: Оставьте пустым для вкуса без сока.
      - name: note
        label: Описание в карточке
        widget: text
        hint: Две-три строки живым языком. Не обещайте лечения — это БАД, а не лекарство.
      - name: hit
        label: Пометка «хит»
        widget: boolean
        required: false
        default: false
        hint: Плашка на карточке. Разумно держать её ровно на одном товаре.

  # ── Страницы ──────────────────────────────────────────────────────────
  # Каждая коллекция — один шаблон. Поле «Адрес страницы» задаёт ссылку и
  # заполняется латиницей: имя файла становится адресом, а кириллица в
  # адресе превращается в нечитаемую строку из процентов.

  - name: goroda
    label: Города доставки
    label_singular: Город
    folder: content/goroda
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{fields.address}}"
    identifier_field: city
    summary: "{{city}} — {{deliveryTime}}"
    fields:
      - name: address
        label: Адрес страницы
        widget: string
        pattern: ["^[a-z0-9-]+$", "Только латинские буквы в нижнем регистре, цифры и дефис"]
        hint: "Часть ссылки после /dostavka/. Например: sevastopol. Без кириллицы и пробелов."
      - name: city
        label: Город
        widget: string
        hint: "Именительный падеж: Севастополь."
      - name: cityIn
        label: Город в предложном падеже
        widget: string
        hint: "Как во фразе «доставка в Севастополе». Пишите: в Севастополе."
      - name: heading
        label: Заголовок на странице
        widget: string
      - name: lede
        label: Вступление
        widget: text
        hint: "Два-три предложения под заголовком."
      - name: deliveryTime
        label: Срок доставки
        widget: string
        hint: "Например: 1–2 дня. Это главное, ради чего человек открыл страницу."
      - name: deliveryPrice
        label: Стоимость доставки
        widget: string
      - name: pickup
        label: Самовывоз
        widget: string
        required: false
        hint: "Оставьте пустым, если самовывоза нет."
      - name: heat
        label: Как везём в жару
        widget: string
        required: false
      - name: order
        label: Порядок в списке
        widget: number
        value_type: int
        default: 50
        hint: "Меньше число — выше в списке городов."
      - name: faq
        label: Вопросы и ответы
        widget: list
        required: false
        label_singular: Вопрос
        summary: "{{fields.q}}"
        fields:
          - { name: q, label: Вопрос, widget: string }
          - { name: a, label: Ответ, widget: text }
      - name: body
        label: Текст страницы
        widget: markdown
        hint: "Здесь пишите то, чем этот город отличается от остальных. Одинаковые страницы поисковик считает мусором и понижает весь сайт."
      - name: draft
        label: Скрыть страницу с сайта
        widget: boolean
        required: false
        default: false
        hint: "Страница исчезает с сайта целиком, но остаётся здесь со всем текстом. Включите, пока страница не готова."
      - name: noindex
        label: Скрыть от поисковиков
        widget: boolean
        required: false
        default: false
      - name: seoTitle
        label: Заголовок в результатах поиска
        widget: string
        hint: "До 60 знаков. Обязательно с городом и словом «коллаген»."
      - name: seoDescription
        label: Описание в результатах поиска
        widget: text
        hint: "До 160 знаков. Цена и срок доставки здесь работают лучше общих слов."

  - name: razbory
    label: Разборы и сравнения
    label_singular: Разбор
    folder: content/razbory
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{fields.address}}"
    identifier_field: heading
    summary: "{{heading}}"
    fields:
      - name: address
        label: Адрес страницы
        widget: string
        pattern: ["^[a-z0-9-]+$", "Только латинские буквы в нижнем регистре, цифры и дефис"]
        hint: "Часть ссылки после /razbor/. Например: zhele-ili-kapsuly."
      - name: heading
        label: Заголовок на странице
        widget: string
      - name: shortAnswer
        label: Короткий ответ
        widget: text
        hint: "Одна-две фразы в самом верху. Именно их поисковик показывает в выдаче, и именно их прочитают, если не станут читать дальше."
      - name: aLabel
        label: Первый вариант
        widget: string
        hint: "То, с чем сравниваем. Например: Порошок."
      - name: bLabel
        label: Второй вариант
        widget: string
        hint: "Ваш вариант. Например: Желе Collagen Live."
      - name: rows
        label: Строки сравнения
        widget: list
        label_singular: Строка
        summary: "{{fields.aspect}}"
        fields:
          - { name: aspect, label: Что сравниваем, widget: string }
          - { name: a, label: Первый вариант, widget: text }
          - { name: b, label: Второй вариант, widget: text }
      - name: conclusion
        label: Вывод
        widget: text
      - name: disclaimer
        label: Оговорка внизу
        widget: text
        required: false
        hint: "Для БАД оговорка обязательна. Сравнивайте категории товаров, но не конкретные фирмы — сравнение с названным конкурентом нарушает закон о рекламе."
      - name: body
        label: Текст страницы
        widget: markdown
      - name: draft
        label: Скрыть страницу с сайта
        widget: boolean
        required: false
        default: false
        hint: "Страница исчезает с сайта целиком, но остаётся здесь со всем текстом. Включите, пока страница не готова."
      - name: noindex
        label: Скрыть от поисковиков
        widget: boolean
        required: false
        default: false
      - name: seoTitle
        label: Заголовок в результатах поиска
        widget: string
      - name: seoDescription
        label: Описание в результатах поиска
        widget: text

  - name: instrukcii
    label: Инструкции
    label_singular: Инструкция
    folder: content/instrukcii
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{fields.address}}"
    identifier_field: heading
    summary: "{{heading}}"
    fields:
      - name: address
        label: Адрес страницы
        widget: string
        pattern: ["^[a-z0-9-]+$", "Только латинские буквы в нижнем регистре, цифры и дефис"]
        hint: "Часть ссылки после /kak/. Например: kak-prinimat."
      - name: heading
        label: Заголовок на странице
        widget: string
      - name: lede
        label: Вступление
        widget: text
      - name: steps
        label: Шаги
        widget: list
        label_singular: Шаг
        summary: "{{fields.title}}"
        fields:
          - { name: title, label: Название шага, widget: string }
          - { name: text, label: Что делать, widget: text }
      - name: ifThen
        label: Блок «а что если»
        widget: list
        required: false
        label_singular: Случай
        summary: "{{fields.q}}"
        fields:
          - { name: q, label: Что случилось, widget: string }
          - { name: a, label: Что делать, widget: text }
      - name: warning
        label: Предупреждение внизу
        widget: text
        required: false
      - name: body
        label: Текст страницы
        widget: markdown
      - name: draft
        label: Скрыть страницу с сайта
        widget: boolean
        required: false
        default: false
        hint: "Страница исчезает с сайта целиком, но остаётся здесь со всем текстом. Включите, пока страница не готова."
      - name: noindex
        label: Скрыть от поисковиков
        widget: boolean
        required: false
        default: false
      - name: seoTitle
        label: Заголовок в результатах поиска
        widget: string
      - name: seoDescription
        label: Описание в результатах поиска
        widget: text

  - name: ceny
    label: Прайс-листы
    label_singular: Прайс-лист
    folder: content/ceny
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{fields.address}}"
    identifier_field: heading
    summary: "{{heading}}"
    fields:
      - name: address
        label: Адрес страницы
        widget: string
        pattern: ["^[a-z0-9-]+$", "Только латинские буквы в нижнем регистре, цифры и дефис"]
        hint: "Часть ссылки после /ceny/. Например: opt."
      - name: heading
        label: Заголовок на странице
        widget: string
      - name: lede
        label: Вступление
        widget: text
      - name: updated
        label: Цены действительны на
        widget: datetime
        date_format: "DD.MM.YYYY"
        time_format: false
        picker_utc: true
        hint: "Дата печатается на странице. Прайс без даты покупатель считает устаревшим."
      - name: groups
        label: Разделы прайса
        widget: list
        label_singular: Раздел
        summary: "{{fields.name}}"
        fields:
          - { name: name, label: Название раздела, widget: string }
          - { name: note, label: Подпись под названием, widget: string, required: false }
          - name: items
            label: Позиции
            widget: list
            label_singular: Позиция
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - { name: name, label: Название, widget: string }
              - { name: price, label: Цена, widget: string, hint: "Пишите так, как надо показать: 2 700 ₽, от 500 ₽, бесплатно, по расчёту." }
              - { name: note, label: Примечание, widget: string, required: false }
      - name: footnote
        label: Сноска внизу
        widget: text
        required: false
      - name: body
        label: Текст страницы
        widget: markdown
        required: false
      - name: draft
        label: Скрыть страницу с сайта
        widget: boolean
        required: false
        default: false
        hint: "Страница исчезает с сайта целиком, но остаётся здесь со всем текстом. Включите, пока страница не готова."
      - name: noindex
        label: Скрыть от поисковиков
        widget: boolean
        required: false
        default: false
      - name: seoTitle
        label: Заголовок в результатах поиска
        widget: string
      - name: seoDescription
        label: Описание в результатах поиска
        widget: text

  # ── Свободная страница ────────────────────────────────────────────────
  # Конструктор: страница собирается из блоков в любом порядке. Набор блоков
  # закрытый и оформление выбирается из трёх вариантов — иначе редактор без
  # дизайнерского образования неизбежно соберёт что-то, что стыдно показать.
  # Чтобы убрать этот раздел у клиента, которому он не нужен, достаточно
  # дописать сюда строку `hide: true` — данные при этом останутся на месте.

  - name: stranicy
    label: Свободные страницы
    label_singular: Страница
    folder: content/stranicy
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{fields.address}}"
    identifier_field: heading
    summary: "{{heading}}"
    fields:
      - name: address
        label: Адрес страницы
        widget: string
        pattern: ["^[a-z0-9-]+$", "Только латинские буквы в нижнем регистре, цифры и дефис"]
        hint: "Часть ссылки после /stranica/. Например: o-nas."
      - name: heading
        label: Заголовок
        widget: string
      - name: lede
        label: Вступление
        widget: text
        required: false
      - name: layout
        label: Оформление страницы
        widget: select
        default: standard
        options:
          - { label: "Обычное — текст и панель с ценой сбоку", value: standard }
          - { label: "Узкое — одна колонка по центру, для длинных текстов", value: narrow }
          - { label: "Промо — крупный заголовок, без панели, для акций", value: promo }
        hint: "Панель с ценой уместна там, где человек может купить. На длинном тексте или на странице акции она мешает."
      - name: blocks
        label: Блоки страницы
        widget: list
        label_singular: Блок
        types:
          - name: text
            label: Текст
            summary: "Текст: {{fields.heading}}"
            widget: object
            fields:
              - { name: heading, label: Подзаголовок, widget: string, required: false }
              - name: body
                label: Текст
                widget: text
                hint: "Абзацы разделяйте пустой строкой. Жирный — **вот так**, ссылка — [текст](/adres/)."
          - name: facts
            label: Таблица «параметр — значение»
            summary: "Факты: {{fields.heading}}"
            widget: object
            fields:
              - { name: heading, label: Подзаголовок, widget: string, required: false }
              - name: items
                label: Строки
                widget: list
                label_singular: Строка
                summary: "{{fields.label}} — {{fields.value}}"
                fields:
                  - { name: label, label: Параметр, widget: string }
                  - { name: value, label: Значение, widget: string }
          - name: steps
            label: Нумерованные шаги
            summary: "Шаги: {{fields.heading}}"
            widget: object
            fields:
              - { name: heading, label: Подзаголовок, widget: string, required: false }
              - name: items
                label: Шаги
                widget: list
                label_singular: Шаг
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: Название шага, widget: string }
                  - { name: text, label: Что делать, widget: text }
          - name: qa
            label: Вопросы и ответы
            summary: "Вопросы: {{fields.heading}}"
            widget: object
            fields:
              - { name: heading, label: Подзаголовок, widget: string, required: false }
              - name: items
                label: Вопросы
                widget: list
                label_singular: Вопрос
                summary: "{{fields.q}}"
                fields:
                  - { name: q, label: Вопрос, widget: string }
                  - { name: a, label: Ответ, widget: text }
          - name: cards
            label: Карточки в ряд
            summary: "Карточки: {{fields.heading}}"
            widget: object
            fields:
              - { name: heading, label: Подзаголовок, widget: string, required: false }
              - name: items
                label: Карточки
                widget: list
                label_singular: Карточка
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: Заголовок, widget: string }
                  - { name: text, label: Текст, widget: text }
          - name: price
            label: Мини-прайс
            summary: "Прайс: {{fields.heading}}"
            widget: object
            fields:
              - { name: heading, label: Подзаголовок, widget: string, required: false }
              - { name: note, label: Подпись, widget: string, required: false }
              - name: items
                label: Позиции
                widget: list
                label_singular: Позиция
                summary: "{{fields.name}} — {{fields.price}}"
                fields:
                  - { name: name, label: Название, widget: string }
                  - { name: price, label: Цена, widget: string }
                  - { name: note, label: Примечание, widget: string, required: false }
          - name: quote
            label: Цитата
            summary: "Цитата: {{fields.author}}"
            widget: object
            fields:
              - { name: text, label: Текст цитаты, widget: text }
              - { name: author, label: Кто сказал, widget: string, required: false }
          - name: image
            label: Картинка
            summary: "Картинка: {{fields.alt}}"
            widget: object
            fields:
              - { name: src, label: Файл, widget: image }
              - name: alt
                label: Описание для незрячих и поисковика
                widget: string
                hint: "Что на картинке. Это читают вслух программы для незрячих и по этому её находит поиск."
              - { name: caption, label: Подпись под картинкой, widget: string, required: false }
          - name: cta
            label: Зелёный блок с кнопкой
            summary: "Кнопка: {{fields.buttonLabel}}"
            widget: object
            fields:
              - { name: heading, label: Заголовок, widget: string }
              - { name: text, label: Текст, widget: text, required: false }
              - { name: buttonLabel, label: Надпись на кнопке, widget: string }
              - name: buttonHref
                label: Куда ведёт кнопка
                widget: string
                default: "/#shop"
                hint: "Адрес на сайте, например /#shop или /ceny/price/."
          - name: note
            label: Сноска или предупреждение
            summary: "Сноска"
            widget: object
            fields:
              - { name: text, label: Текст, widget: text }
      - name: draft
        label: Скрыть страницу с сайта
        widget: boolean
        required: false
        default: false
        hint: "Страница исчезает с сайта целиком, но остаётся здесь со всем текстом. Включите, пока страница не готова."
      - name: noindex
        label: Скрыть от поисковиков
        widget: boolean
        required: false
        default: false
        hint: "Страница остаётся на сайте и открывается по ссылке, но не попадает в поиск."
      - name: seoTitle
        label: Заголовок в результатах поиска
        widget: string
      - name: seoDescription
        label: Описание в результатах поиска
        widget: text

  # ── Статьи ────────────────────────────────────────────────────────────
  # Самый простой из шаблонов и самый дешёвый в наполнении: шапка и текст.
  # Пачку статей удобнее заводить не здесь, а скриптом:
  #   node scripts/split-articles.mjs файл-со-статьями.txt
  # Скрипт режет один файл на отдельные статьи, не пропуская текст через
  # нейросеть — на сотне статей это разница в сотни тысяч токенов.

  - name: stati
    label: Статьи
    label_singular: Статья
    folder: content/stati
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{fields.address}}"
    identifier_field: heading
    summary: "{{heading}}"
    sortable_fields: [date, heading]
    fields:
      - name: address
        label: Адрес страницы
        widget: string
        pattern: ["^[a-z0-9-]+$", "Только латинские буквы в нижнем регистре, цифры и дефис"]
        hint: "Часть ссылки после /stati/. Например: kak-hranit-letom."
      - name: heading
        label: Заголовок
        widget: string
      - name: lede
        label: Вступление
        widget: text
        hint: "Два-три предложения под заголовком. Это не описание для поиска, а первое, что читает человек."
      - name: date
        label: Дата
        widget: datetime
        date_format: "DD.MM.YYYY"
        time_format: false
        picker_utc: true
      - name: cover
        label: Обложка
        widget: string
        required: false
        hint: "Адрес картинки, например /media/glass.jpg. Оставьте пустым, если обложка не нужна."
      - name: coverAlt
        label: Описание обложки
        widget: string
        required: false
        hint: "Что на картинке. Читают вслух программы для незрячих, по нему же картинку находит поиск."
      - name: body
        label: Текст статьи
        widget: markdown
        hint: "Подзаголовки, списки, ссылки и картинки. Не обещайте лечения — это БАД, а не лекарство."
      - name: draft
        label: Скрыть страницу с сайта
        widget: boolean
        required: false
        default: false
        hint: "Страница исчезает с сайта целиком, но остаётся здесь со всем текстом."
      - name: noindex
        label: Скрыть от поисковиков
        widget: boolean
        required: false
        default: false
      - name: seoTitle
        label: Заголовок в результатах поиска
        widget: string
        hint: "До 60 знаков. Может отличаться от заголовка на странице."
      - name: seoDescription
        label: Описание в результатах поиска
        widget: text
        hint: "До 160 знаков."
